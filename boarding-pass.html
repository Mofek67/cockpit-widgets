<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boarding pass</title>
<style>@font-face{font-family:'B612';src:url(fonts/B612-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612';src:url(fonts/B612-Bold.woff2) format('woff2');font-weight:700;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Bold.woff2) format('woff2');font-weight:700;font-display:swap}</style>
<style>
:root{--paper:#F7F9FB;--ink:#15314D;--dim:#6C7F92;--blue:#337EA9;--deep:#1F4E79;--amber:#E9A13B;--bg:#191919}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg)}
body{font-family:'B612',system-ui,sans-serif;color:var(--ink);padding:6px;-webkit-font-smoothing:antialiased}
.pass{height:100%;min-height:190px;display:flex;filter:drop-shadow(0 1px 2px rgba(20,40,70,.18)) drop-shadow(0 6px 18px rgba(20,40,70,.12))}
.main,.stub{background:var(--paper);position:relative}
.main{flex:1;border-radius:16px 0 0 16px;display:flex;flex-direction:column;overflow:hidden;
 -webkit-mask:radial-gradient(circle 10px at 100% 0,#0000 98%,#000) top right/100% 51% no-repeat,radial-gradient(circle 10px at 100% 100%,#0000 98%,#000) bottom right/100% 51% no-repeat;
 mask:radial-gradient(circle 10px at 100% 0,#0000 98%,#000) top right/100% 51% no-repeat,radial-gradient(circle 10px at 100% 100%,#0000 98%,#000) bottom right/100% 51% no-repeat}
.stub{width:30%;min-width:150px;border-radius:0 16px 16px 0;border-left:2px dashed #C9D3DD;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;
 -webkit-mask:radial-gradient(circle 10px at 0 0,#0000 98%,#000) top left/100% 51% no-repeat,radial-gradient(circle 10px at 0 100%,#0000 98%,#000) bottom left/100% 51% no-repeat;
 mask:radial-gradient(circle 10px at 0 0,#0000 98%,#000) top left/100% 51% no-repeat,radial-gradient(circle 10px at 0 100%,#0000 98%,#000) bottom left/100% 51% no-repeat}
.band{background:var(--deep);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
.band b{font-size:14px;display:flex;align-items:center;gap:8px}
.band svg{width:16px;height:16px;fill:var(--amber)}
.band span{font-size:12px;opacity:.8}
.body{flex:1;padding:14px 20px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.route{display:flex;align-items:center;gap:14px}
.code{font-family:'B612 Mono',monospace;font-size:clamp(26px,6vw,38px);font-weight:700;line-height:1}
.city{font-size:12px;color:var(--dim);margin-top:4px}
.path{flex:1;height:2px;background:repeating-linear-gradient(90deg,#AFC0D0 0 6px,transparent 6px 11px);position:relative}
.path svg{position:absolute;left:50%;top:-9px;width:20px;height:20px;margin-left:-10px;fill:var(--blue);background:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(4,auto);gap:10px 18px;justify-content:space-between}
.k{font-size:10.5px;color:var(--dim)}
.v{font-family:'B612 Mono',monospace;font-size:14px;font-weight:700;margin-top:2px}
.stub .v{font-size:13px}
.bars{height:46px;display:flex;align-items:stretch;gap:0}
.bars i{display:block;background:var(--ink)}
@media (max-width:540px){.stub{display:none}.main{border-radius:16px;-webkit-mask:none;mask:none}.grid{grid-template-columns:repeat(2,auto)}}
</style></head>
<body>
<div class="pass">
  <div class="main">
    <div class="band"><b><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>Cockpit Air</b><span>Boarding pass</span></div>
    <div class="body">
      <div class="route">
        <div><div class="code" id="fc">NEW</div><div class="city" id="fn">First flight</div></div>
        <div class="path"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg></div>
        <div style="text-align:right"><div class="code" id="tc">CPT</div><div class="city" id="tn">Flight deck</div></div>
      </div>
      <div class="grid">
        <div><div class="k">Passenger</div><div class="v" id="nm">YOUR NAME</div></div>
        <div><div class="k">Flight</div><div class="v">CKP 001</div></div>
        <div><div class="k">Class</div><div class="v">One</div></div>
        <div><div class="k">Seat</div><div class="v">Left</div></div>
      </div>
    </div>
  </div>
  <div class="stub">
    <div><div class="k">Passenger</div><div class="v" id="nm2">YOUR NAME</div></div>
    <div style="display:flex;justify-content:space-between"><div><div class="k">Gate</div><div class="v">ATPL</div></div><div><div class="k">Boarding</div><div class="v">Now</div></div></div>
    <div class="bars" id="bars"></div>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search),g=(k,d)=>(q.get(k)||d);
const name=g('name','Your name').toUpperCase().slice(0,22);
nm.textContent=nm2.textContent=name;
fc.textContent=g('fromcode','NEW').toUpperCase().slice(0,4);tc.textContent=g('tocode','CPT').toUpperCase().slice(0,4);
fn.textContent=g('from','First flight');tn.textContent=g('to','Flight deck');
let h=2166136261;for(const c of name+'CKP')h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
for(let i=0;i<46;i++){h=Math.imul(h^(h>>>13),1597334677)>>>0;const b=document.createElement('i');b.style.width=(1+h%3)+'px';b.style.marginRight=(1+(h>>>3)%3)+'px';if(i%2)b.style.background='transparent';bars.appendChild(b)}
</script>
</body></html>
