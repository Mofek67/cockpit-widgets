<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar scope</title>
<style>@font-face{font-family:'B612';src:url(fonts/B612-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612';src:url(fonts/B612-Bold.woff2) format('woff2');font-weight:700;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Bold.woff2) format('woff2');font-weight:700;font-display:swap}</style>
<style>
:root{--panel:var(--bg,#191919);--line:#2F2F2F;--ink:#E5E7EB;--dim:#9CA3AF;--amber:#F59E0B;--green:#10B981;--T:6s}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg,#191919);overflow:hidden}
body{font-family:'B612',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.card{position:relative;height:100%;min-height:160px;background:var(--panel);display:flex;align-items:center;justify-content:center}
.scope{position:relative;width:calc(100vmin - 24px);height:calc(100vmin - 24px);min-width:136px;min-height:136px}
.scope svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* rotating beam: a conic wedge that trails behind a bright leading edge */
.sweep{position:absolute;inset:2%;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(16,185,129,0) 0deg,rgba(16,185,129,0) 285deg,rgba(16,185,129,.05) 315deg,rgba(16,185,129,.34) 360deg);
  will-change:transform}
.sweep::after{content:"";position:absolute;left:50%;top:0;width:1.5px;height:50%;margin-left:-.75px;
  background:linear-gradient(to top,rgba(16,185,129,0),var(--green))}
.run .sweep{animation:turn var(--T) linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.grid{fill:none;stroke:var(--green)}
.txt{font-family:'B612 Mono',ui-monospace,monospace;font-size:5.6px;fill:var(--green);opacity:.55}
.own{fill:var(--amber)}
.blip{opacity:.5}
.run .blip{animation:ping var(--T) linear infinite}
@keyframes ping{0%{opacity:1}10%{opacity:.8}100%{opacity:.07}}
.run .blip.t{animation-name:pingt}
@keyframes pingt{0%{opacity:1}100%{opacity:.42}}
.run .drift{animation:drift var(--D,80s) ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(var(--dx,0),var(--dy,0))}}
.tag{font-family:'B612 Mono',ui-monospace,monospace;font-size:6px;font-weight:700;fill:var(--amber)}
.cap,.rng{position:absolute;font-size:11px;color:var(--dim);line-height:1.2;white-space:nowrap}
.cap{left:14px;top:12px}
.rng{right:14px;bottom:12px;font-family:'B612 Mono',ui-monospace,monospace;letter-spacing:.04em}
@media (max-width:210px),(max-height:210px){.cap,.rng{display:none}}
@media (prefers-reduced-motion:reduce){.run .sweep,.run .blip,.run .drift{animation:none}.blip{opacity:.7}}
</style><script>(function(){var b=new URLSearchParams(location.search).get('bg');if(!b)return;var r=document.documentElement.style;if(b==='peek'){r.setProperty('--bg','#202020');r.setProperty('--well','#282828');r.setProperty('--tile','#2E2E2E');r.setProperty('--tile2','#282828');r.setProperty('--line','#363636')}else if(/^[0-9a-fA-F]{3,8}$/.test(b)){r.setProperty('--bg','#'+b)}})()</script></head>
<body>
<div class="card" id="card">
  <div class="cap" id="cap">Traffic</div>
  <div class="scope" role="img" aria-label="Animated radar scope">
    <div class="sweep"></div>
    <svg viewBox="-100 -100 200 200" aria-hidden="true">
      <g class="grid" id="grid"></g>
      <g id="labels"></g>
      <g id="traffic"></g>
      <path class="own" d="M0-5 4 4 0 2-4 4Z"/>
    </svg>
  </div>
  <div class="rng" id="rng">RNG 30 NM</div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const q=new URLSearchParams(location.search);
const num=(k,d,lo,hi)=>{const v=parseFloat(q.get(k));return isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
const T=num('speed',6,2,30), N=Math.round(num('targets',5,0,12)), RNG=Math.round(num('rng',30,3,300));
const callsign=q.has('callsign')?q.get('callsign').slice(0,10):'CKP001';
const label=q.has('label')?q.get('label'):'Traffic';
document.documentElement.style.setProperty('--T',T+'s');
cap.textContent=label; if(!label)cap.style.display='none';
rng.textContent='RNG '+RNG+' NM';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const pol=(r,deg)=>{const a=deg*Math.PI/180;return [r*Math.sin(a),-r*Math.cos(a)]};

// range rings, crosshair and bearing ticks
[30,60,90].forEach(r=>el('circle',{r,'stroke-width':.5,opacity:.22},grid));
el('circle',{r:96,'stroke-width':.8,opacity:.5},grid);
el('path',{d:'M-96 0H96M0-96V96','stroke-width':.4,opacity:.16},grid);
for(let d=0;d<360;d+=10){const big=d%30===0,[x1,y1]=pol(big?89:92.5,d),[x2,y2]=pol(96,d);
  el('line',{x1,y1,x2,y2,'stroke-width':big?.8:.5,opacity:big?.6:.35},grid)}
[['N',0],['090',90],['180',180],['270',270]].forEach(([t,d])=>{const [x,y]=pol(81,d);
  el('text',{x,y:y+2,'text-anchor':'middle',class:'txt'},labels).textContent=t});
[1,2].forEach(i=>{const [x,y]=pol(30*i,135);
  el('text',{x:x+2,y:y+6,class:'txt',opacity:.4},labels).textContent=Math.round(RNG*i/3)});

// traffic: same picture on every load (seeded), each target lights up as the beam passes
let s=(parseInt(q.get('seed'),10)||7)>>>0;
const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function target(deg,r,tagged){
  const [x,y]=pol(r,deg),hdg=rnd()*360,[dx,dy]=pol(6+rnd()*8,hdg);
  const g=el('g',{class:'drift',style:`--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;--D:${(60+rnd()*60).toFixed(0)}s`},traffic);
  const b=el('g',{class:tagged?'blip t':'blip',style:`animation-delay:${(deg/360*T-T).toFixed(2)}s`},g);
  const c=tagged?'var(--amber)':'var(--green)';
  el('circle',{cx:x,cy:y,r:4.6,fill:c,opacity:.16},b);
  el('circle',{cx:x,cy:y,r:1.7,fill:c},b);
  if(tagged){const right=x<25,tx=x+(right?9:-9),ty=y-8;
    el('line',{x1:x+(right?2.5:-2.5),y1:y-2.5,x2:tx+(right?-1.5:1.5),y2:ty+1.5,stroke:'var(--amber)','stroke-width':.5,opacity:.8},b);
    el('text',{x:tx,y:ty,'text-anchor':right?'start':'end',class:'tag'},b).textContent=tagged}
}
for(let i=0;i<N;i++)target((i*360/Math.max(N,1)+rnd()*46+18)%360,22+rnd()*60);
if(callsign)target(38,54,callsign);
card.classList.add('run');
</script>
</body></html>
