<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phonetic trainer</title>
<style>@font-face{font-family:'B612';src:url(fonts/B612-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612';src:url(fonts/B612-Bold.woff2) format('woff2');font-weight:700;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Bold.woff2) format('woff2');font-weight:700;font-display:swap}</style>
<style>
:root{--panel:#191919;--line:#2F2F2F;--well:#202020;--ink:#E5E7EB;--dim:#9CA3AF;--amber:#F59E0B;--cyan:#10B981;--green:#10B981;--red:#F59E0B}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#191919;overflow:hidden}
body{font-family:'B612',system-ui,sans-serif;color:var(--ink);padding:0;-webkit-font-smoothing:antialiased}
.card{height:100%;min-height:300px;background:var(--panel);border-radius:0;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.modes{display:flex;background:var(--well);border-radius:10px;padding:3px}
.modes button{border:0;background:none;color:var(--dim);font:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--line);color:var(--ink)}
.score{font-family:'B612 Mono',monospace;font-size:12px;color:var(--dim)}
.score b{color:var(--green)}.score i{font-style:normal;color:var(--red)}
.stage{flex:1;background:var(--well);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center}
.glyph{font-family:'B612 Mono',monospace;font-weight:700;font-size:clamp(48px,16vw,96px);line-height:1;color:var(--cyan);letter-spacing:.04em}
.glyph.small{font-size:clamp(30px,9vw,54px)}
.ans{min-height:48px}
.word{font-size:clamp(18px,5vw,26px);font-weight:700}
.say{font-family:'B612 Mono',monospace;font-size:13px;color:var(--amber);margin-top:4px}
.hint{font-size:12px;color:var(--dim)}
.acts{display:flex;gap:8px}
.acts button{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);background:var(--line)}
.acts .ok{background:rgba(16,185,129,.16);color:var(--green)}.acts .ko{background:rgba(245,158,11,.14);color:var(--amber)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
</style></head>
<body>
<div class="card">
  <div class="top">
    <div class="modes" role="group" aria-label="Mode">
      <button data-m="L" aria-pressed="true">Letters</button><button data-m="N" aria-pressed="false">Numbers</button><button data-m="R" aria-pressed="false">Callsigns</button>
    </div>
    <div class="score"><b id="ok">0</b> known · <i id="ko">0</i> missed</div>
  </div>
  <div class="stage">
    <div class="glyph" id="g">Q</div>
    <div class="ans" id="ans"><div class="hint">Say it out loud, then reveal.</div></div>
  </div>
  <div class="acts" id="a1"><button id="rev">Reveal</button></div>
  <div class="acts hide" id="a2"><button class="ko" id="bko">Missed</button><button class="ok" id="bok">Got it</button></div>
</div>
<script>
const A=[['A','Alfa','AL-fah'],['B','Bravo','BRAH-voh'],['C','Charlie','CHAR-lee'],['D','Delta','DELL-tah'],['E','Echo','ECK-oh'],['F','Foxtrot','FOKS-trot'],['G','Golf','GOLF'],['H','Hotel','hoh-TELL'],['I','India','IN-dee-ah'],['J','Juliett','JEW-lee-ETT'],['K','Kilo','KEY-loh'],['L','Lima','LEE-mah'],['M','Mike','MIKE'],['N','November','no-VEM-ber'],['O','Oscar','OSS-cah'],['P','Papa','pah-PAH'],['Q','Quebec','keh-BECK'],['R','Romeo','ROW-me-oh'],['S','Sierra','see-AIR-rah'],['T','Tango','TANG-go'],['U','Uniform','YOU-nee-form'],['V','Victor','VIK-tah'],['W','Whiskey','WISS-key'],['X','X-ray','ECKS-ray'],['Y','Yankee','YANG-key'],['Z','Zulu','ZOO-loo']];
const N=[['0','Zero','ZE-RO'],['1','One','WUN'],['2','Two','TOO'],['3','Three','TREE'],['4','Four','FOW-er'],['5','Five','FIFE'],['6','Six','SIX'],['7','Seven','SEV-en'],['8','Eight','AIT'],['9','Nine','NIN-er']];
const PFX=['F','D','G','EC','OO','HB','I','PH'];
const pick=a=>a[Math.random()*a.length|0];
let mode='L',cur=null,last=null,okN=0,koN=0;
function next(f){
  g.classList.remove('small');
  if(mode==='R'){const p=pick(PFX);let s='';while(s.length<(p.length===1?4:3))s+=pick(A)[0];
    cur={g:p+'-'+s,w:(p+s).split('').map(c=>A.find(x=>x[0]===c)[1]).join(' '),s:''};g.classList.add('small')}
  else{let x;do{x=pick(mode==='L'?A:N)}while(x===last);last=x;cur={g:x[0],w:x[1],s:x[2]}}
  g.textContent=cur.g;ans.innerHTML='<div class="hint">Say it out loud, then reveal.</div>';a1.classList.remove('hide');a2.classList.add('hide');if(f)rev.focus({preventScroll:true})}
function reveal(){ans.innerHTML='<div class="word"></div><div class="say"></div>';ans.firstChild.textContent=cur.w;ans.lastChild.textContent=cur.s;a1.classList.add('hide');a2.classList.remove('hide')}
rev.onclick=reveal;
bok.onclick=()=>{ok.textContent=++okN;next(1)};bko.onclick=()=>{ko.textContent=++koN;next(1)};
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));next(1)});
addEventListener('keydown',e=>{if(e.key===' '&&!a1.classList.contains('hide')){e.preventDefault();reveal()}else if(!a2.classList.contains('hide')){if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();bok.click()}if(e.key==='ArrowLeft'){e.preventDefault();bko.click()}}});
next();
</script>
</body></html>
