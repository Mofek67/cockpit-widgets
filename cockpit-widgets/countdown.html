<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next milestone</title>
<style>@font-face{font-family:'B612';src:url(fonts/B612-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612';src:url(fonts/B612-Bold.woff2) format('woff2');font-weight:700;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Bold.woff2) format('woff2');font-weight:700;font-display:swap}</style>
<style>
:root{--panel:var(--bg,#191919);--line:#2F2F2F;--ink:#E5E7EB;--dim:#9CA3AF;--amber:#F59E0B}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg,#191919);overflow:hidden}
body{font-family:'B612',system-ui,sans-serif;color:var(--ink);padding:0;-webkit-font-smoothing:antialiased}
.card{height:100%;min-height:150px;background:var(--panel);border-radius:0;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lbl{font-size:12px;color:var(--dim)}
.etd{font-family:'B612 Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.06em;white-space:nowrap}
h1{font-size:clamp(18px,4.5vw,24px);font-weight:700;margin-top:4px}
.row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.days{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(44px,14vw,72px);line-height:.9;letter-spacing:-.03em}
.days small{font-family:'B612',sans-serif;font-size:14px;font-weight:400;color:var(--dim);letter-spacing:0;margin-left:6px}
.hms{font-variant-numeric:tabular-nums;font-size:18px;color:var(--dim);padding-bottom:4px}
.rwy{position:relative;height:22px}
.rwy .strip{position:absolute;left:0;right:0;top:10px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
.rwy .done{position:absolute;left:0;top:10px;height:2px;background:var(--amber)}
.rwy svg{position:absolute;top:1px;width:20px;height:20px;margin-left:-10px;fill:var(--amber)}
.hidden{display:none}
</style><script>(function(){var b=new URLSearchParams(location.search).get('bg');if(!b)return;var r=document.documentElement.style;if(b==='peek'){r.setProperty('--bg','#202020');r.setProperty('--well','#282828');r.setProperty('--tile','#2E2E2E');r.setProperty('--tile2','#282828');r.setProperty('--line','#363636')}else if(/^[0-9a-fA-F]{3,8}$/.test(b)){r.setProperty('--bg','#'+b)}})()</script></head>
<body>
<div class="card">
  <div>
    <div class="top"><span class="lbl">Next milestone</span><span class="etd" id="etd"></span></div>
    <h1 id="title">First solo</h1>
  </div>
  <div class="row"><div class="days" id="days">--<small>days</small></div><div class="hms" id="hms">--:--:--</div></div>
  <div class="rwy hidden" id="rwy"><div class="strip"></div><div class="done" id="done"></div>
    <svg id="plane" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg></div>
</div>
<script>
const q=new URLSearchParams(location.search);
const M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3]):null};
const to=parse(q.get('to'))||new Date(new Date().getFullYear()+1,8,1);
const from=parse(q.get('from'));
title.textContent=q.get('label')||'First solo';
etd.textContent='ETD '+String(to.getDate()).padStart(2,'0')+' '+M[to.getMonth()]+' '+to.getFullYear();
if(from&&from<to)rwy.classList.remove('hidden');
const p=n=>String(n).padStart(2,'0');
function tick(){
  const now=new Date(),ms=to-now;
  if(ms<=0){days.innerHTML='0<small>days</small>';hms.textContent='Airborne. Set your next milestone.';done.style.width='100%';plane.style.left='100%';return}
  const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,mi=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  days.innerHTML=d+'<small>'+(d===1?'day':'days')+'</small>';
  hms.textContent=p(h)+':'+p(mi)+':'+p(s);
  if(from){const f=Math.min(1,Math.max(0,(now-from)/(to-from)));done.style.width=(f*100)+'%';plane.style.left=(f*100)+'%'}
}
tick();setInterval(tick,1000);
</script>
</body></html>
