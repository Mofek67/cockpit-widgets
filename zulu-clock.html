<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zulu clock</title>
<style>@font-face{font-family:'B612';src:url(fonts/B612-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612';src:url(fonts/B612-Bold.woff2) format('woff2');font-weight:700;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Regular.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'B612 Mono';src:url(fonts/B612Mono-Bold.woff2) format('woff2');font-weight:700;font-display:swap}</style>
<style>
:root{--panel:#191919;--line:#2F2F2F;--ink:#E5E7EB;--dim:#9CA3AF;--amber:#F59E0B}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#191919;overflow:hidden}
body{font-family:'B612',system-ui,sans-serif;color:var(--ink);padding:0;-webkit-font-smoothing:antialiased}
.card{height:100%;min-height:120px;background:var(--panel);border-radius:0;display:flex;align-items:stretch;overflow:hidden}
.main{flex:1.6;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.side{flex:1;padding:18px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:6px}
.lbl{font-size:12px;color:var(--dim)}
.mono{font-family:'B612 Mono',ui-monospace,monospace}
.t,.lt{font-variant-numeric:tabular-nums}
.t{font-size:clamp(34px,11vw,64px);font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.t .s{font-size:.42em;color:var(--dim);font-weight:400;margin-left:2px}
.t .z{font-size:.5em;color:var(--amber);margin-left:8px}
.d{font-size:13px;color:var(--dim);letter-spacing:.06em}
.lt{font-size:clamp(22px,6vw,34px);font-weight:700;line-height:1}
@media (max-width:380px){.card{flex-direction:column}.side{border-left:0;border-top:1px solid var(--line)}}
</style></head>
<body>
<div class="card">
  <section class="main">
    <div class="lbl">Coordinated universal time</div>
    <div class="t"><span id="zh">--:--</span><span class="s" id="zs">:--</span><span class="z">Z</span></div>
    <div class="d mono" id="zd">&nbsp;</div>
  </section>
  <section class="side">
    <div class="lbl" id="ll">Local time</div>
    <div class="lt" id="lh">--:--</div>
    <div class="d mono" id="lo">&nbsp;</div>
  </section>
</div>
<script>
const q=new URLSearchParams(location.search);
const tz=q.get('tz')||undefined, label=q.get('label');
if(label)document.getElementById('ll').textContent=label;
const M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],D=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const p=n=>String(n).padStart(2,'0');
let fmt,off;
try{fmt=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz});
off=new Intl.DateTimeFormat('en-GB',{timeZoneName:'shortOffset',timeZone:tz});}
catch(e){fmt=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});off=new Intl.DateTimeFormat('en-GB',{timeZoneName:'shortOffset'});}
function tick(){
  const n=new Date();
  zh.textContent=p(n.getUTCHours())+':'+p(n.getUTCMinutes());
  zs.textContent=':'+p(n.getUTCSeconds());
  zd.textContent=D[n.getUTCDay()]+' '+p(n.getUTCDate())+' '+M[n.getUTCMonth()]+' '+n.getUTCFullYear();
  lh.textContent=fmt.format(n);
  const o=(off.formatToParts(n).find(x=>x.type==='timeZoneName')||{}).value||'';
  lo.textContent=(o==='GMT'?'UTC+0':o.replace('GMT','UTC'))+(tz?'  '+tz.split('/').pop().replace('_',' '):'');
}
tick();setInterval(tick,1000);
</script>
</body></html>
